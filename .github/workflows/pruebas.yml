name: Pruebas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Revisar sintaxis
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Pruebas de horas de manejo (NOM-087)
        run: npm test
